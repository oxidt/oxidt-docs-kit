name: Oxidt Docs Kit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on rapid pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run vendor:pele
      - name: Check bundled Pele modules are fresh
        run: git diff --exit-code -- crates/oxidt-mdx/assets/pele crates/oxidt-mdx/src/pele_assets.rs
      - run: bun run test:diagrams

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Check Format
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: rui314/setup-mold@v1
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The crate ships a precompiled stylesheet (DOCS_KIT_CSS). Fail if the
      # committed output is stale relative to its input/sources (`just css`).
      # Uses the lockfile-pinned binary, not bunx, so local and CI output match.
      - name: Check vendored oxidt-ui matches its pinned tag
        run: |
          ./scripts/vendor-oxidt-ui.sh
          git diff --exit-code vendor/oxidt-ui
          test -z "$(git status --porcelain vendor/oxidt-ui)"
      - name: Check precompiled kit CSS is fresh
        run: |
          ./node_modules/.bin/tailwindcss -i crates/topcoat-docs-kit/tailwind.css -o crates/topcoat-docs-kit/assets/docs-kit.css --minify
          git diff --exit-code crates/topcoat-docs-kit/assets/docs-kit.css
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The types-only build that dioxus-docs-kit's wasm client links.
      - name: Run Clippy (no default features)
        run: cargo clippy -p oxidt-mdx -p oxidt-docs-kit-core --no-default-features --all-targets -- -D warnings

  unused-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies for vulnerabilities
        run: cargo audit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: rui314/setup-mold@v1
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run unit tests
        run: cargo test --workspace --all-features

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep in sync with workspace.package.rust-version in Cargo.toml.
      # The pipeline crates use let-chains, which need 1.88 (dioxus-docs-kit
      # builds on them at that MSRV). topcoat-docs-kit is the exception: it
      # follows Topcoat's MSRV (1.98), which the jobs above run on.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: rui314/setup-mold@v1
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check published crates on the declared MSRV
        run: cargo check -p oxidt-mdx -p oxidt-docs-kit-core -p oxidt-docs-kit-build -p hl-lite

