[package]
name = "oxidt-mdx"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MDX parser and document types: Mintlify-style components, OpenAPI specs and Markdown to HTML, with no UI framework"
documentation = "https://docs.rs/oxidt-mdx"
keywords = ["mdx", "markdown", "documentation", "parser"]
categories = ["parsing", "web-programming", "text-processing"]
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
tracing = { workspace = true }
regex-lite = { version = "0.1", optional = true }
markdown = { version = "1.0", optional = true }
openapiv3 = { version = "2.0", optional = true }

[features]
default = ["parse", "openapi-parse"]

# The MDX/Markdown parser, including Markdown -> HTML rendering. Pulls in
# markdown-rs and a regex engine, so a docs-kit app leaves it off: its pages are
# parsed at build time and shipped as a JSON bundle of already-rendered nodes.
parse = ["dep:markdown", "dep:regex-lite"]

# `openapi` is the value types (no extra dependencies). `openapi-parse` adds the
# spec *parser* (`parse_openapi`, inline `<OpenAPI>` blocks) and with it
# `openapiv3` and `serde_yaml` — build-time only in a docs-kit app.
openapi = []
openapi-parse = ["openapi", "parse", "dep:openapiv3", "dep:serde_yaml"]

[package.metadata.docs.rs]
features = ["parse", "openapi-parse"]
