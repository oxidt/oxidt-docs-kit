[package]
name = "topcoat-docs-kit"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Topcoat's own MSRV.
rust-version = "1.98"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Documentation site shell for Topcoat applications, on the oxidt-docs-kit content pipeline"
documentation = "https://docs.rs/topcoat-docs-kit"
keywords = ["topcoat", "documentation", "mdx", "docs-site"]
categories = ["web-programming"]
readme = "README.md"

[dependencies]
oxidt-docs-kit-core = { workspace = true, features = ["openapi"] }
# Types, the Lucide icon data and the highlighter only: no Dioxus components.
oxidt-mdx = { workspace = true }
hl-lite = { workspace = true }
topcoat = { version = "0.10.0", default-features = false, features = ["router"] }

[features]
default = ["mermaid"]
# Render ```mermaid fences as diagrams. Once a diagram nears the viewport, the
# browser loads bundled Pele modules via the diagram_assets route. Disable
# this feature to render fences as ordinary code blocks.
mermaid = []

[dev-dependencies]
oxidt-docs-kit-build = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
