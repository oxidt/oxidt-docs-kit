[workspace]
resolver = "3"
members = [
    "crates/oxidt-docs-kit-build",
    "crates/oxidt-mdx",
    "crates/oxidt-docs-kit-core",
    "crates/hl-lite",
    "crates/oxidt-docs",
    "crates/topcoat-docs-kit",
    "examples/topcoat-docs",
]

[workspace.package]
version = "0.11.0"
authors = ["Hauke Jung <hauke.jung@outlook.de>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/oxidt/oxidt-docs-kit"
homepage = "https://github.com/oxidt/oxidt-docs-kit"

[workspace.dependencies]
oxidt-mdx = { version = "0.11.0", path = "crates/oxidt-mdx", default-features = false }
oxidt-docs-kit-core = { version = "0.11.0", path = "crates/oxidt-docs-kit-core", default-features = false }
oxidt-docs-kit-build = { version = "0.11.0", path = "crates/oxidt-docs-kit-build" }
hl-lite = { version = "0.11.0", path = "crates/hl-lite" }
serde = { version = "1.0", features = ["derive"] }
schemars = "1"
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
